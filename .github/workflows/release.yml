name: release
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs third-party code (packages, the compiler), so it gets read access only.
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
          no-cache: true # do not reuse a cached Bun download in a release
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/honk-*.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # already gzipped

  # Installs and runs the Linux binaries in Docker on several distros, each CPU
  # on its own runner. A release is only published if every combination passes.
  test:
    name: Test on Linux (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # check out the test scripts and install.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - run: sh scripts/test-linux.sh
        env:
          HONK_TEST_PLATFORMS: ${{ matrix.platform }}

  # Runs no third-party build code. It signs the binaries and creates the release.
  publish:
    name: Attest and publish
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # get the OIDC token that signs the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # Unpack a copy of each binary, so the attestation covers both the .gz
      # files and the installed binaries (gh attestation verify ~/.local/bin/honk).
      - run: gzip -dk dist/honk-*.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/honk-*
      # install.sh checks each download against this file.
      - run: cd dist && sha256sum honk-*.gz > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/honk-*.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
