version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript major versions need config and code changes; upgrade by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      opentui:
        patterns: ["@opentui/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
