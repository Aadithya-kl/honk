version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait a week before suggesting a new version. Most malicious releases are
    # found and removed within days.
    cooldown:
      default-days: 7
    ignore:
      # TypeScript major versions need config and code changes; upgrade by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      opentui:
        patterns: ["@opentui/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
